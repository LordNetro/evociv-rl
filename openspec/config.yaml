# openspec/config.yaml
schema: spec-driven

context: |
  Tech stack: Go 1.26.2 (golang) — módulos estándar, sin framework web, con go.mod
  Architecture: Dwarf Fortress-like world simulator with LOD simulation, GOAP + RL hybrid,
    Data-Driven (YAML configs), LLM local (Ollama) for dialogues, Bubbletea TUI,
    SQLite for persistence
  Testing: go test (built-in) — ACTIVE with Strict TDD
  Style: gofmt (standard), golangci-lint expected

strict_tdd: true
# Strict TDD Mode ACTIVE: Go toolchain 1.26.2 installed, go.mod created.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
  archive:
    - Warn before merging destructive deltas (large removals)

testing:
  strict_tdd: true
  detected: "2026-05-04"
  notes: "Go 1.26.2 installed, go.mod created. Strict TDD mode ACTIVE."
  test_runner:
    command: go test ./...
    framework: go test (built-in)
  layers:
    unit:
      available: true
      tool: go test
    integration:
      available: true
      tool: net/http/httptest (built-in)
    e2e:
      available: false
      tool: "(not installed)"
  coverage:
    available: false
    command: go test -cover ./...
  quality:
    linter:
      available: false
      command: golangci-lint (not installed)
    type_checker:
      available: false
      command: go vet
    formatter:
      available: false
      command: gofmt
