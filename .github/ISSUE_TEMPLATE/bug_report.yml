name: Bug Report
description: Reportar un error en Evociv-RL
title: "fix: "
labels: ["bug", "status:needs-review"]
body:
  - type: markdown
    attributes:
      value: |
          ## 🐛 Bug Report

          Gracias por reportar. Antes de crear el issue, asegúrate de:
          - [ ] He buscado issues existentes y este no es un duplicado
          - [ ] Entiendo que este issue necesita `status:approved` antes de abrir un PR

  - type: textarea
    id: description
    attributes:
      label: Descripción del Bug
      description: Descripción clara y concisa del error
      placeholder: "Ej: Al cargar un mundo, la aplicación se cierra sin mensaje de error..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Pasos para Reproducir
      description: Pasos numerados para reproducir el error
      placeholder: |
          1. Ejecutar `go run ./cmd/evociv`
          2. Presionar 'g' para generar mundo
          3. El programa se cierra
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamiento Esperado
      description: ¿Qué debería pasar?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Comportamiento Actual
      description: ¿Qué pasa en su lugar? Incluye errores/logs
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Sistema Operativo
      options:
        - Windows
        - macOS
        - Linux
        - WSL
    validations:
      required: true

  - type: dropdown
    id: go_version
    attributes:
      label: Versión de Go
      options:
        - 1.26.x
        - 1.25.x
        - 1.24.x
        - Other
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs Relevantes
      description: Copia y pega cualquier log o mensaje de error
      render: text
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Contexto Adicional
      description: Screenshots, workarounds, información extra
    validations:
      required: false
